<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard ReclameAQUI | Microsoft</title>
<style>
:root {
    --bg-color: #f3f2f1;
    --card-bg: #ffffff;
    --text-color: #323130;
    --primary-color: #0078d4;
    --primary-hover: #106ebe;
    --purple-color: #5c2d91;
    --purple-hover: #4b2475;
    --danger-color: #d13438;
    --danger-hover: #a8282b;
    --border-color: #d1d1d1;
    --preview-bg: #fafafa;
    --tab-bg: #eaeaea;
    --tab-text: #323130;
    --retorno-bg: #fffdf4;
    --retorno-border: #f2c811;
    --retorno-text: #8a6d00;
    --badge-geral-bg: #e1f5fe;
    --badge-geral-text: #0288d1;
    --badge-retorno-bg: #fff3e0;
    --badge-retorno-text: #f57c00;
}

[data-theme="dark"] {
    --bg-color: #111111;
    --card-bg: #1b1b1b;
    --text-color: #f5f5f5;
    --primary-color: #0086f0;
    --primary-hover: #339af2;
    --purple-color: #723db5;
    --purple-hover: #8553ca;
    --danger-color: #e84144;
    --danger-hover: #ef6366;
    --border-color: #444444;
    --preview-bg: #242424;
    --tab-bg: #2d2d2d;
    --tab-text: #cccccc;
    --retorno-bg: #2d2919;
    --retorno-border: #bfa00f;
    --retorno-text: #f7df72;
    --badge-geral-bg: #0d3c55;
    --badge-geral-text: #64b5f6;
    --badge-retorno-bg: #4a2700;
    --badge-retorno-text: #ffb74d;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    height: 100vh;
    padding: 15px;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
}

.header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1600px;
    margin: 0 auto 10px auto;
    height: 40px;
}

h2 {
    color: var(--primary-color);
    font-size: 20px;
}

.theme-toggle-btn {
    padding: 8px 16px;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-color);
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
}

.theme-toggle-btn:hover {
    border-color: var(--primary-color);
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    max-width: 1600px;
    margin: auto;
    height: calc(100vh - 70px);
}

.card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 4px 12px rgba(0,0,0,.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border-color);
    transition: background 0.3s, border-color 0.3s;
}

.form-scroll-container {
    flex: 1;
    overflow-y: auto;
    padding-right: 5px;
}

label {
    display: block;
    margin-top: 10px;
    font-weight: 600;
    font-size: 13px;
}

input, textarea {
    width: 100%;
    padding: 8px 12px;
    margin-top: 4px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text-color);
    transition: all 0.2s;
}

input:focus, textarea:focus {
    outline: none;
    border-color: var(--primary-color);
}

textarea {
    min-height: 80px;
    resize: none;
}

#problema, #retornoProblema {
    min-height: 100px;
}
#orientacao, #retornoInstrucao {
    min-height: 120px;
}

.retorno-exclusivo-fields {
    background: var(--retorno-bg);
    border: 1px dashed var(--retorno-border);
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    transition: background 0.3s, border-color 0.3s;
}

.retorno-exclusivo-title {
    font-size: 12px;
    text-transform: uppercase;
    color: var(--retorno-text);
    letter-spacing: 0.5px;
    font-weight: bold;
    margin-bottom: 2px;
}

.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
}

.tab {
    flex: 1;
    padding: 10px 4px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: var(--tab-bg);
    color: var(--tab-text);
    font-weight: 600;
    font-size: 13px;
    text-align: center;
    transition: all 0.2s;
}

.tab:hover {
    opacity: 0.9;
}

.tab.active {
    background: var(--primary-color);
    color: #fff;
}

.preview {
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: var(--preview-bg);
    padding: 12px;
    flex: 1;
    overflow-y: auto;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.5;
    transition: background 0.3s, border-color 0.3s;
}

.btn-group {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.2s;
}

.btn-primary { background: var(--primary-color); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }

.btn-purple { background: var(--purple-color); color: #fff; }
.btn-purple:hover { background: var(--purple-hover); }

.btn-danger { background: var(--danger-color); color: #fff; }
.btn-danger:hover { background: var(--danger-hover); }

#templateArea {
    display: none;
    flex: 1;
    overflow-y: auto;
}

.template-card {
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    background: var(--card-bg);
    transition: all 0.2s;
}

.badge {
    display: inline-block;
    padding: 2px 6px;
    font-size: 10px;
    border-radius: 4px;
    font-weight: bold;
    margin-bottom: 6px;
    text-transform: uppercase;
}
.badge-geral { background: var(--badge-geral-bg); color: var(--badge-geral-text); }
.badge-retorno { background: var(--badge-retorno-bg); color: var(--badge-retorno-text); }

.template-card strong {
    font-size: 14px;
}

.template-card p {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 2px;
}

.template-card button {
    margin-top: 8px;
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    background: var(--primary-color);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
}
.template-card button:hover { background: var(--primary-hover); }

@media(max-width:900px){
    body { overflow: auto; height: auto; }
    .container { grid-template-columns: 1fr; height: auto; }
    .preview, #templateArea { height: 400px; }
}
</style>
</head>
<body>

<div class="header-bar">
    <h2>Atendimento Microsoft</h2>
    <button class="theme-toggle-btn" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> <span id="theme-text">Modo Black</span>
    </button>
</div>

<div class="container">

    <div class="card">
        <div class="form-scroll-container">
            <label>Atendente</label>
            <input id="atendente" oninput="salvarAtendente(); gerarResposta();" placeholder="Seu nome">

            <label>Cliente</label>
            <input id="cliente" oninput="gerarResposta()" placeholder="Nome do cliente">

            <!-- Campos Padrões para abas Privada/Pública -->
            <div id="camposPadraoSecao">
                <label>Problema Informado (Privada/Pública)</label>
                <textarea id="problema" oninput="gerarResposta()" placeholder="Relato inicial do problema..."></textarea>

                <label>Observação Interna (Privada)</label>
                <textarea id="observacao" oninput="gerarResposta()" placeholder="Informações de segurança ou notas internas de sistema..."></textarea>

                <label>Orientação Passada (Privada/Pública)</label>
                <textarea id="orientacao" oninput="gerarResposta()" placeholder="Etapas repassadas para o cliente realizar..."></textarea>
            </div>

            <!-- Campos Exclusivos para a Aba Resposta Retorno -->
            <div id="camposRetornoSecao" class="retorno-exclusivo-fields" style="display: none;">
                <div class="retorno-exclusivo-title">Exclusivo: Resposta Retorno</div>
                
                <label>Dificuldade/Erro relatado pelo cliente no retorno</label>
                <textarea id="retornoProblema" oninput="gerarResposta()" placeholder="Ex: Cliente informa que o código de erro persiste ao carregar a página..."></textarea>

                <label>Nova Instrução ou Solução direcionada</label>
                <textarea id="retornoInstrucao" oninput="gerarResposta()" placeholder="Ex: Solicitei a execução em Modo Privado e envio do print completo..."></textarea>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab active" id="tabPrivada" onclick="mudarAba('privada')">Privada</button>
            <button class="tab" id="tabRespostaRetorno" onclick="mudarAba('resposta_retorno')">Resposta Retorno</button>
            <button class="tab" id="tabPublica" onclick="mudarAba('publica')">Pública</button>
            <button class="tab" id="tabTemplates" onclick="mudarAba('templates')">Templates</button>
        </div>

        <div id="preview" class="preview"></div>

        <div id="templateArea">
            <input id="buscaInput" placeholder="Pesquisar template..." onkeyup="buscarTemplate(this.value)">
            <br><br>
            <div id="listaTemplates"></div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="copiarResposta()">Copiar Resposta</button>
            <button class="btn btn-purple" onclick="copiarSemAssinatura()">Copiar Sem Assinatura</button>
            <button class="btn btn-danger" onclick="limparCampos()">Limpar Campos</button>
        </div>
    </div>

</div>

<script>
let abaAtual = "privada";

const templates = [
    {
        id: 1,
        tipo: "geral",
        categoria: "Conta Microsoft",
        titulo: "Conta Bloqueada",
        problema: "Conta Microsoft bloqueada por atividade suspeita.",
        orientacao: "Realizar a recuperação de segurança através do formulário oficial de validação Microsoft."
    },
    {
        id: 2,
        tipo: "geral",
        categoria: "Xbox",
        titulo: "Game Pass",
        problema: "Problema com processamento da assinatura Game Pass",
        orientacao: "Validar os métodos de pagamento vinculados, conferir o status da assinatura ativa e garantir login com a conta correta."
    },
    {
        id: 3,
        tipo: "geral",
        categoria: "Windows",
        titulo: "Ativação",
        problema: "Erro genérico de validação e ativação do Windows",
        orientacao: "Executar o solucionador de problemas de ativação nativo e conferir a chave de licença digital."
    },
    {
        id: 4,
        tipo: "retorno",
        categoria: "Retorno",
        titulo: "Erro persiste após procedimentos",
        problema: "O erro original continua mesmo executando as orientações anteriores.",
        orientacao: "Coletar evidências adicionais e escalar para suporte nível 2 para verificação de conta."
    },
    {
        id: 5,
        tipo: "retorno",
        categoria: "Retorno",
        titulo: "Pedido de Prints / Logs",
        problema: "Cliente retornou sem as mídias ou informações completas do erro.",
        orientacao: "Solicitar o envio legível de capturas de tela e do código de erro gerado para análise técnica."
    },
    {
        id: 6,
        tipo: "retorno",
        categoria: "Retorno",
        titulo: "Dificuldade Técnica na Execução",
        problema: "Cliente relata dificuldade para realizar as etapas propostas de forma autônoma.",
        orientacao: "Apresentar um passo a passo mais simplificado ou sugerir contato via central telefônica assistida."
    }
];

function assinatura(){
    const atendente = document.getElementById("atendente").value.trim() || "[Atendente]";
    return `Atenciosamente,

${atendente}
Equipe ReclameAQUI/Microsoft

Conheça nossos canais oficiais:

Central de Atendimento: 0800 761 7454
https://microsoft.com

Xbox:
https://xbox.com

Facebook:
BrasilWindows / MSFTBrasil

TikTok:
@MicrosoftBrasil

Instagram:
Microsoftbr

X:
@MicrosoftAjuda`;
}

function gerarResposta(){
    const cliente = document.getElementById("cliente").value.trim() || "[Cliente]";
    const atendente = document.getElementById("atendente").value.trim() || "[Atendente]";
    
    const problema = document.getElementById("problema").value.trim() || "[Problema]";
    const observacao = document.getElementById("observacao").value.trim();
    const orientacao = document.getElementById("orientacao").value.trim() || "[Orientação]";
    
    const retornoProblema = document.getElementById("retornoProblema").value.trim() || "[Dificuldade relatada pelo cliente]";
    const retornoInstrucao = document.getElementById("retornoInstrucao").value.trim() || "[Nova instrução ou próximo passo]";

    let texto = "";

    if (abaAtual === "privada") {
        texto = `Olá ${cliente},

Obrigado por contatar a Microsoft.

Meu nome é ${atendente}.

Problema informado:
${problema}

${observacao ? `Observação Interna:
${observacao}

` : ""}Orientação:
${orientacao}

${assinatura()}`;
    } 
    else if (abaAtual === "publica") {
        texto = `Olá ${cliente},

Obrigado pelo contato.

Em atenção à sua manifestação:
${problema}

Esclarecemos que:
${orientacao}

${assinatura()}`;
    } 
    else if (abaAtual === "resposta_retorno") {
        texto = `Olá ${cliente},

Obrigado pelo retorno.

Entendemos o ocorrido em relação ao seguinte cenário trazido:
${retornoProblema}

Para darmos continuidade e resolvermos isso, por favor siga estas novas orientações:
${retornoInstrucao}

Permanecemos à inteira disposição.

${assinatura()}`;
    }

    document.getElementById("preview").innerText = texto;
}

function mudarAba(aba){
    abaAtual = aba;

    document.querySelectorAll(".tab").forEach(btn => btn.classList.remove("active"));
    document.getElementById("preview").style.display = "block";
    document.getElementById("templateArea").style.display = "none";

    // Controle de exibição dos painéis de campos da esquerda
    if (aba === "resposta_retorno") {
        document.getElementById("camposPadraoSecao").style.display = "none";
        document.getElementById("camposRetornoSecao").style.display = "block";
        document.getElementById("tabRespostaRetorno").classList.add("active");
        gerarResposta();
    } else if (aba === "templates") {
        document.getElementById("tabTemplates").classList.add("active");
        document.getElementById("preview").style.display = "none";
        document.getElementById("templateArea").style.display = "block";
        carregarTemplates();
    } else {
        document.getElementById("camposPadraoSecao").style.display = "block";
        document.getElementById("camposRetornoSecao").style.display = "none";
        if (aba === "privada") document.getElementById("tabPrivada").classList.add("active");
        if (aba === "publica") document.getElementById("tabPublica").classList.add("active");
        gerarResposta();
    }
}

function carregarTemplates(lista = templates){
    let html = "";
    lista.forEach(template => {
        const isRetorno = template.tipo === "retorno";
        const badgeClass = isRetorno ? "badge-retorno" : "badge-geral";
        const badgeLabel = isRetorno ? "Retorno" : "Geral";

        html += `
        <div class="template-card">
            <span class="badge ${badgeClass}">${badgeLabel}</span><br>
            <strong>${template.categoria} - ${template.titulo}</strong>
            <p>Preenche de forma automática os campos mapeados.</p>
            <button onclick="usarTemplate(${template.id})">Usar Template</button>
        </div>
        `;
    });
    document.getElementById("listaTemplates").innerHTML = html;
}

function usarTemplate(id){
    const t = templates.find(x => x.id === id);
    if (!t) return;

    if (t.tipo === "retorno") {
        document.getElementById("retornoProblema").value = t.problema;
        document.getElementById("retornoInstrucao").value = t.orientacao;
        mudarAba("resposta_retorno");
    } else {
        document.getElementById("problema").value = t.problema;
        document.getElementById("orientacao").value = t.orientacao;
        mudarAba("privada");
    }
    gerarResposta();
}

function buscarTemplate(valor){
    const filtrados = templates.filter(t =>
        t.titulo.toLowerCase().includes(valor.toLowerCase()) ||
        t.categoria.toLowerCase().includes(valor.toLowerCase()) ||
        t.problema.toLowerCase().includes(valor.toLowerCase())
    );
    carregarTemplates(filtrados);
}

function copiarResposta(){
    const texto = document.getElementById("preview").innerText.trim();
    navigator.clipboard.writeText(texto)
        .then(() => alert("Resposta completa copiada com sucesso!"))
        .catch(err => alert("Erro ao copiar texto: " + err));
}

function copiarSemAssinatura(){
    let texto = document.getElementById("preview").innerText;
    const assinaturaTexto = assinatura().trim();
    
    if (texto.includes(assinaturaTexto)) {
        texto = texto.replace(assinaturaTexto, "");
    }
    
    texto = texto.trim();
    navigator.clipboard.writeText(texto)
        .then(() => alert("Resposta copiada sem assinatura com sucesso!"))
        .catch(err => alert("Erro ao copiar texto: " + err));
}

function limparCampos(){
    document.getElementById("cliente").value = "";
    document.getElementById("problema").value = "";
    document.getElementById("observacao").value = "";
    document.getElementById("orientacao").value = "";
    document.getElementById("retornoProblema").value = "";
    document.getElementById("retornoInstrucao").value = "";
    gerarResposta();
}

// Funções de Persistência Local (LocalStorage)
function salvarAtendente(){
    const atendente = document.getElementById("atendente").value;
    localStorage.setItem("ra_atendente", atendente);
}

function carregarPreferencias(){
    // Carrega Atendente
    const salvoAtendente = localStorage.getItem("ra_atendente");
    if (salvoAtendente) {
        document.getElementById("atendente").value = salvoAtendente;
    }
    
    // Carrega Tema
    const salvoTema = localStorage.getItem("ra_theme");
    if (salvoTema === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        document.getElementById("theme-icon").innerText = "☀️";
        document.getElementById("theme-text").innerText = "Modo Claro";
    }
}

function toggleTheme(){
    const currentTheme = document.documentElement.getAttribute("data-theme");
    if (currentTheme === "dark") {
        document.documentElement.removeAttribute("data-theme");
        document.getElementById("theme-icon").innerText = "🌙";
        document.getElementById("theme-text").innerText = "Modo Black";
        localStorage.setItem("ra_theme", "light");
    } else {
        document.documentElement.setAttribute("data-theme", "dark");
        document.getElementById("theme-icon").innerText = "☀️";
        document.getElementById("theme-text").innerText = "Modo Claro";
        localStorage.setItem("ra_theme", "dark");
    }
}

// Inicialização segura
document.addEventListener("DOMContentLoaded", () => {
    carregarPreferencias();
    gerarResposta();
});
carregarPreferencias();
gerarResposta();
</script>
</body>
</html>
